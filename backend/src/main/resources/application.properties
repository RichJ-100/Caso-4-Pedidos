spring.application.name=pedidos
server.port=8080
server.error.include-message=always
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pedidos}
spring.datasource.username=${DB_USER:pedidos}
spring.datasource.password=${DB_PASSWORD:pedidos123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
tienda.reserva-minutos=${RESERVA_MINUTOS:15}
management.endpoints.web.exposure.include=health,info